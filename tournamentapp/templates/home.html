<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KV Tournament 6</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Libraries -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      color: #333;
      text-transform: uppercase;
      margin: 0;
    }

    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }

    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .top-nav a {
      font-weight: bold;
      color: #ffffff;
      background-color: #2c3e50;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
    }

    .top-nav a:hover {
      background-color: #1a1a1a;
    }

    .input-row {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .input-group {
      text-align: center;
    }

    .input-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .input-group input {
      padding: 8px;
      width: 260px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background-color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #eee;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"] {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 90%;
      box-sizing: border-box;
    }

    input[type="submit"] {
      padding: 6px 14px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    .view-btn {
      background-color: #2980b9;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .view-btn:hover,
    input[type="submit"]:hover {
      opacity: 0.9;
    }

    .unsold-link {
      text-align: center;
      margin-top: 40px;
    }

    .unsold-link a {
      font-weight: bold;
      color: #1a73e8;
      text-decoration: none;
      font-size: 18px;
    }

    .unsold-link a:hover {
      text-decoration: underline;
    }

    @media screen and (max-width: 768px) {
      .input-row {
        flex-direction: column;
        align-items: center;
      }

      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead tr {
        display: none;
      }

      tbody tr {
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background-color: #fff;
        padding: 10px;
      }

      td {
        text-align: right;
        padding-left: 50%;
        position: relative;
      }

      td::before {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        width: 45%;
        padding-left: 10px;
        font-weight: bold;
        text-align: left;
        color: #555;
      }

      input[type="submit"],
      .view-btn {
        width: 100%;
        margin-top: 8px;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        margin-top: 6px;
      }

      .input-group input {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h1>KV TOURNAMENT 6</h1>

  <div class="input-row">
    <div class="input-group">
      <label for="searchPlayerName">Player Name</label>
      <input type="text" id="searchPlayerName" placeholder="Start typing player name...">
    </div>

    <div class="input-group">
      <label for="searchHumanName">Team Name</label>
      <input type="text" id="searchHumanName" placeholder="Start typing team name...">
    </div>

    <div class="input-group">
      <label>&nbsp;</label>
      <button id="sendAllBalanceBtn" class="view-btn" style="background-color: #25D366; width: 260px;">Send All Balances</button>
    </div>

    <div class="input-group">
      <label>&nbsp;</label>
      <button id="triggerBot" class="view-btn" style="background-color: #ff5722; width: 260px;">Send WhatsApp Images</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>SI.NO</th>
        <th>Name</th>
        <th>Balance</th>
        <th>Player</th>
        <th>Action</th>
        <th>View </th>
      </tr>
    </thead>
    <tbody>
      {% for i in data %}
      <form method="post">
        {% csrf_token %}
        <tr>
          <td data-label="SI.NO">{{ forloop.counter }}</td>
          <td data-label="Name">{{ i.name }}</td>
          <td data-label="Balance">{{ i.total }}</td>
          <td data-label="Player">
            <input type="text" name="player_name" class="player-name-input">
            <input type="hidden" name="id" value="{{ i.id }}">
          </td>
          <td data-label="Action">
            <input type="number" name="called_value" required>
            <input type="submit" value="UPDATE">
          </td>
          <td data-label="View / Msg">
            <a href="{% url 'human_detail' i.id %}">
              <button class="view-btn" type="button">View</button>
            </a>
          </td>
        </tr>
      </form>
      {% endfor %}
    </tbody>
  </table>

  <div class="top-nav">
    <a href="{% url 'add_player' %}">Add Player</a>
    <a href="{% url 'players' %}">View Players</a>
    <a href="{% url 'unsold' %}">View Unsold Players</a>
  </div>

  <div class="unsold-link">
    <form action="{% url 'reset_data' %}" method="post" onsubmit="return confirm('Are you sure you want to reset everything?');">
      {% csrf_token %}
      <button type="submit" style="margin-top: 20px; background-color: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">
        RESET DATABASE
      </button>
    </form>
  </div>

  <script>
    $(function () {
      var playerNames = [
        {% for player in players %}
          "{{ player.name|escapejs }}"{% if not forloop.last %},{% endif %}
        {% endfor %}
      ];

      $(".player-name-input").autocomplete({ source: playerNames });

      $("#searchPlayerName").autocomplete({
        source: playerNames,
        select: function (event, ui) {
          $(".player-name-input").val(ui.item.value);
        }
      });

      $("#searchHumanName").on("keyup", function () {
        var value = $(this).val().toLowerCase();
        $("table tbody tr").filter(function () {
          var humanName = $(this).find("td[data-label='Name']").text().toLowerCase();
          $(this).toggle(humanName.indexOf(value) > -1);
        });
      });

      $('#sendAllBalanceBtn').on('click', function () {
        if (!confirm("Copy combined balance message and open WhatsApp group?")) return;

        const humans = [
          {% for i in data %}
            {
              name: "{{ i.name|escapejs }}",
              balance: "{{ i.total }}"
            }{% if not forloop.last %},{% endif %}
          {% endfor %}
        ];

        let message = "\ud83d\udcb0 *KV Tournament Balances* \ud83d\udcb0\n\n";

        humans.forEach(h => {
          message += `\u2022 ${h.name}: \u20b9${h.balance}\n`;
        });

        message += "\nCall carefully! \u26a0\ufe0f";

        navigator.clipboard.writeText(message).then(function () {
          alert("\u2705 Balances copied to clipboard!");
        }, function () {
          alert("\u274c Failed to copy. Please copy manually:\n\n" + message);
        });
      });

      // ✅ Trigger WhatsApp bot
      $('#triggerBot').on('click', function () {
        if (confirm("Trigger WhatsApp image sender?")) {
          fetch("{% url 'trigger_bot' %}").then(() => alert("\u2705 WhatsApp bot triggered!"));
        }
      });
    });
  </script>
</body>
</html>
