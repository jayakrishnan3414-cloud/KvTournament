<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unsold Players</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            background: #f9f9f9;
            text-transform:uppercase
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
            margin-top: 40px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            margin: 0 auto 20px auto;
            display: block;
            box-sizing: border-box;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 400px;
            margin: 0 auto 30px auto;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px 10px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #f2f2f2;
            font-weight: 600;
        }

        tr.no-results td {
            text-align: center;
            font-style: italic;
            color: #777;
        }

        button {
            padding: 6px 12px;
            font-size: 13px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c9302c;
        }

        .action-buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        .action-buttons a button {
            margin: 0 10px;
            background-color: #5cb85c;
        }

        .action-buttons a:last-child button {
            background-color: red;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 20px;
            }

            th, td {
                font-size: 13px;
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>

    <h1>All Players</h1>

    <div class="action-buttons">
        <a href="{% url 'add_player' %}"><button>Add Player</button></a>
        <a href="{% url 'home' %}"><button>HOME</button></a>
    </div>

    <input type="text" id="searchInput" placeholder="Search players by name..." onkeyup="filterTable()">

    <div class="table-wrapper">
        <table id="playersTable">
            <thead>
                <tr>
                  <th>SI.NO</th>
                  <th>Name</th>
                  <th>Auctioned Value</th>
                  <th>Owned By</th> <!-- NEW -->
                  <th>Delete</th>
                </tr>
              </thead>
              
            <tbody>
                {% for player in players %}
                <tr id="player-row-{{ player.id }}">
                    <td>{{ forloop.counter }}</td>
                    <td>{{ player.name }}</td>
                    <td>{{ player.auctioned_value }}</td>
                    <td>
                      {% if player.HUMAN %}
                        {{ player.HUMAN.name }}
                      {% else %}
                        <!-- blank if not owned -->
                      {% endif %}
                    </td>
                    <td><button onclick="deletePlayer({{ player.id }})">Delete</button></td>
                  </tr>
                  
                {% empty %}
                <tr>
                    <td colspan="4">No players available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("playersTable");
            const tr = table.getElementsByTagName("tr");
            let visibleCount = 0;

            for (let i = 1; i < tr.length; i++) {
                const tdName = tr[i].getElementsByTagName("td")[1];
                if (tdName) {
                    const txtValue = tdName.textContent || tdName.innerText;
                    if (txtValue.toLowerCase().includes(filter)) {
                        tr[i].style.display = "";
                        visibleCount++;
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }

            if (visibleCount === 0) {
                if (!document.querySelector(".no-results")) {
                    const tbody = table.querySelector("tbody");
                    const noResultsRow = document.createElement("tr");
                    noResultsRow.className = "no-results";
                    noResultsRow.innerHTML = `<td colspan="4">No players match your search.</td>`;
                    tbody.appendChild(noResultsRow);
                }
            } else {
                const noResultsRow = document.querySelector(".no-results");
                if (noResultsRow) {
                    noResultsRow.remove();
                }
            }
        }

        function deletePlayer(playerId) {
            if (confirm("Are you sure you want to delete this player?")) {
                fetch(`/delete-player/${playerId}/`, {
                    method: "POST",
                    headers: {
                        "X-Requested-With": "XMLHttpRequest"
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const row = document.getElementById(`player-row-${playerId}`);
                        if (row) {
                            row.remove();
                        }

                        const tableBody = document.querySelector("#playersTable tbody");
                        const remainingRows = tableBody.querySelectorAll("tr:not(.no-results)");
                        if (remainingRows.length === 0) {
                            const noRow = document.createElement("tr");
                            noRow.className = "no-results";
                            noRow.innerHTML = `<td colspan="4">No players available.</td>`;
                            tableBody.appendChild(noRow);
                        }
                    } else {
                        alert("Error deleting player: " + data.error);
                    }
                })
                .catch(error => {
                    alert("Request failed: " + error);
                });
            }
        }
    </script>

</body>
</html>
